[package]
name = "datafusion-delta-sharing"
version = "0.1.0"
authors = ["Tim Dikland <timdikland@gmail.com>"]
edition = "2021"
rust-version = "1.72.1"
description = "Delta Sharing integaration for DataFusion"
readme = "README.md"
repository = "https://github.com/tdikland/datafusion-delta-sharing"
license = "MIT"
keywords = ["sharing", "delta", "deltalake", "delta-sharing", "datafusion"]
categories = ["database-implementations", "database", "web-programming"]

[dependencies]
arrow = "53.3.0"
arrow-array = "53.3.0"
arrow-schema = "53.3.0"
async-trait = "0.1.77"
bon = "3.3.2"
bytes = "1.5.0"
chrono = "0.4.31"
datafusion = "44.0"
datafusion-catalog = "44.0"
datafusion-common = "44.0"
delta_kernel = { version = "0.6.1", features = [
    "arrow-conversion",
    "default-engine",
] }
form_urlencoded = "1.2.1"
futures = "0.3.30"
http = "1.2.0"
http-body = "1.0.1"
http-body-util = "0.1.2"
http-serde-ext = "1.0.2"
mime = "0.3.17"
object_store = { version = "0.11.0", features = ["http"] }
parquet = { version = "53.3.0", features = ["async"] }
pin-project-lite = "0.2.16"
reqwest = { version = "0.12.11", features = ["json"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_path_to_error = "0.1.16"
serde_urlencoded = "0.7.1"
thiserror = "2.0.11"
tracing = "0.1.40"
url = "2.5.0"
urlencoding = "2.1.3"

[dev-dependencies]
tokio = { version = "1.35.1", features = ["full"] }
httpmock = "0.7.0-rc.1"
tempfile = "3.9.0"
tracing-subscriber = { version = "0.3.18", features = [
    "tracing",
    "env-filter",
] }
tracing-test = { version = "0.2.4", features = ["no-env-filter"] }
insta = { version = "1.42.0", features = ["yaml", "json"] }

[profile.dev.package]
insta.opt-level = 3
